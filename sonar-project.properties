# Configuración de SonarCloud (E12). Reemplazar organización y clave por las del proyecto propio.
sonar.organization=TU-ORGANIZACION
sonar.projectKey=TU-ORGANIZACION_conduit-realworld-example-app
sonar.projectName=Conduit - ACS 2026

sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/migrations/**,**/seeders/**,frontend/dist/**,**/*.test.js,**/*.test.jsx,backend/tests/**
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,backend/tests/**
# La cobertura se mide sobre los módulos críticos definidos en E2 (controladores, middleware,
# helpers y servicios). Vistas, rutas, modelos y configuración quedan fuera del cálculo.
sonar.coverage.exclusions=**/*.test.*,backend/tests/**,backend/index.js,backend/routes/**,backend/models/**,backend/config/**,backend/migrations/**,backend/seeders/**,frontend/src/components/**,frontend/src/routes/**,frontend/src/context/**,frontend/src/hooks/**,frontend/src/App.jsx,frontend/src/main.jsx,frontend/src/reportWebVitals.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
